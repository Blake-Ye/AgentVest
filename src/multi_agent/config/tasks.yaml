market_intelligence_task:
  description: >
    请为 {company_name}（{company_ticker}）构建 {current_year} 年的市场情报简报。
    你必须先使用 Market Profile 工具识别市场，再结合 Google 搜索情报工具和
    Official Disclosure Search 工具收集最新财报背景、产品发布、管理层表态、竞争变化
    和主要风险。只保留有来源支撑的事实，结果必须使用中文，且便于初级分析师阅读。
  expected_output: >
    一份中文 markdown 市场情报简报，至少包含公司概览、近期动态、竞争格局、
    催化剂和风险五个部分，并附上至少 5 条来源引用。
  agent: information_gathering_analyst

filing_review_task:
  description: >
    你必须先使用 Market Profile 工具判断 {company_name}（{company_ticker}）是否属于
    SEC 市场。如果属于 `us_sec`，再使用 SEC 文件检索工具查找最新的 10-K 和 10-Q 文件；
    如果不属于 SEC 市场，则改为使用 Official Disclosure Search 工具返回对应市场的官方披露入口、
    查询链接和下一步应重点核查的官方材料类型。请用中文交叉验证这些资料是否支持前一步的市场情报简报。
  expected_output: >
    一份中文 markdown filing/official disclosure 复核结果，列出最新 filing 或官方披露入口，
    说明每份资料的重要性，并指出财务分析阶段应以哪份材料作为核心依据。
  agent: information_gathering_analyst

financial_analysis_task:
  description: >
    你必须先使用 Market Profile 工具判断 {company_name}（{company_ticker}）所属市场。
    如果属于 `us_sec`，优先使用 SEC 公司财务事实工具和财务指标计算器输出中文财务分析；
    如果不属于 SEC 市场，则基于前一步识别出的官方披露入口、市场情报与可获得的财务事实，
    输出“有依据的中文财务分析 + 明确数据缺口”，不得假装已经拿到 SEC company facts。
    请解释收入质量、利润率、流动性、杠杆和自由现金流。
    当前本地 PDF 状态：{local_filing_pdf_available}；本地 PDF 路径：{local_filing_pdf_path}。
    只有当本地 PDF 状态为 yes 时，才允许使用 PDF 文本提取工具；如果状态不是 yes，
    不要猜测文件名、不要尝试读取不存在的本地文件。若存在数据缺口，必须明确指出，
    不能编造数字。
  expected_output: >
    一份中文 markdown 财务分析，包含简洁的指标表、指标解释，以及对利多和利空
    财务信号的平衡分析。
  agent: financial_statement_analyst

investment_report_task:
  description: >
    请基于之前所有任务输出，为 {company_name} 撰写最终中文投资备忘录。
    报告必须包含执行摘要、业务概览、近期动态、财务分析、风险、催化剂、
    投资建议和置信度，并达到可以给面试官或招聘经理评审的项目作品质量。
    只能使用前序任务 context 和已经生成的工作流产出，不要猜测、读取或引用
    未明确提供的本地 HTML、PDF 或其他文件路径。
  expected_output: >
    一份高质量中文 markdown 投资备忘录，具有清晰标题、引用来源、明确建议，
    并在结尾简要说明该工作流如何提升分析师效率。
  agent: report_writing_analyst
