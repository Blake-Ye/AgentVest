[project]
name = "multi_agent"
version = "0.1.0"
description = "multi_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.6",
    "pypdf>=5.0.0",
    "requests>=2.32.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[project.scripts]
multi_agent = "multi_agent.main:run"
benchmark = "multi_agent.benchmark:main"
run_with_trigger = "multi_agent.main:run_with_trigger"
profile_agent = "multi_agent.perf:main"
api_server = "multi_agent.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
